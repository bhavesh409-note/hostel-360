<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Fraunces:wght@400;500;600&family=Inter:wght@400;500;600&display=swap"><title>HOSTEL360 – The Smarter Way to Live</title>
<style>
:root{--navy:#2F3A52;--blue:#3F4F73;--teal:#A9C4CF;--red:#DC2626;--green:#16A34A;--amb:#D97706;--bg:#FAF8F6;--card:#fff;--tx:#2B2F3A;--mut:#6F7584;--line:#ECE8E3;--topbg:#FAF8F6cc;--h1:#F3ECE6;--h2:#E4ECF1;--htx:#2B2F3A;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
:root[data-theme=dark]{--navy:#3A4768;--blue:#4C5F8A;--bg:#14171F;--card:#1C202B;--tx:#ECE9E4;--mut:#8F95A3;--line:#2A2F3C;--topbg:#14171Fcc;--h1:#1F2433;--h2:#171B26;--htx:#ECE9E4;color-scheme:dark}
*{box-sizing:border-box}html,body{margin:0}body{background:var(--bg);color:var(--tx);font:15px/1.6 "Inter","Segoe UI",system-ui,sans-serif}
h1,h2,h3{margin:0 0 8px;font-family:"Fraunces",Georgia,"Times New Roman",serif;font-weight:500;letter-spacing:-.015em}
.wrap{max-width:1100px;margin:auto;padding:16px}.grid{display:grid;gap:14px;grid-template-columns:repeat(auto-fit,minmax(250px,1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:20px;box-shadow:0 1px 2px #1f24310a,0 8px 24px #1f243108;transition:transform .25s ease,box-shadow .25s ease}.card:hover{transform:translateY(-2px);box-shadow:0 12px 32px #1f243114}
.top{background:var(--topbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);color:var(--tx);border-bottom:1px solid var(--line);padding:10px 16px;display:flex;gap:12px;align-items:center;flex-wrap:nowrap;position:sticky;top:env(safe-area-inset-top,0px);z-index:5;min-height:54px}.top>span:nth-child(3){overflow:hidden;text-overflow:ellipsis;white-space:nowrap;min-width:0}
.logo{font:600 20px "Fraunces",Georgia,serif;letter-spacing:.01em}.logo b{color:var(--blue);font-weight:400;font-style:italic}
.nav{display:flex;gap:4px;overflow-x:auto;padding:8px 16px;background:var(--topbg);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:calc(54px + env(safe-area-inset-top,0px));z-index:4}
.nav button{white-space:nowrap;border-color:transparent;background:transparent;color:var(--mut);border-radius:99px;padding:7px 14px}.nav button:hover:not(:disabled){color:var(--tx);box-shadow:none}.nav button.act{background:var(--navy);color:#fff}
button,select,input,textarea{font:inherit;color:inherit}
button{cursor:pointer;border:1px solid var(--line);background:var(--card);border-radius:12px;padding:7px 12px;transition:transform .15s ease,box-shadow .2s ease,background .2s ease}button:hover:not(:disabled){transform:translateY(-1px);box-shadow:0 4px 12px #1f243122}button:active:not(:disabled){transform:scale(.97)}
button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid var(--blue)}
.p{background:var(--blue);color:#fff;border-color:var(--blue)}.act{background:var(--navy);color:#fff}
.g{background:var(--green);color:#fff;border-color:var(--green)}.r{background:var(--red);color:#fff;border-color:var(--red)}
input,select,textarea{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);margin:4px 0 10px}
.tag{display:inline-block;padding:2px 9px;border-radius:99px;font-size:12px;font-weight:700;background:var(--line);color:var(--tx)}
.t-r{background:#F8E3E1;color:#9B2C2C}.t-g{background:#E5F1E9;color:#2F6B45}.t-y{background:#F6EDDC;color:#7A5A1E}.t-b{background:#E8EDF5;color:#3F4F73}
.mut{color:var(--mut);font-size:13px}.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap;justify-content:space-between}
.bar{height:8px;background:var(--line);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,#C9DCE4,#8FA9C4);transition:width 1s}
.sos{width:100%;padding:22px;font-size:22px;font-weight:800;background:var(--red);color:#fff;border:4px solid #fff;box-shadow:0 0 0 4px var(--red),0 10px 30px #dc262666;border-radius:18px;animation:pulse 2.4s infinite}
@keyframes pulse{50%{box-shadow:0 0 0 9px #dc262633,0 10px 30px #dc262666}}
@keyframes ring{from{stroke-dasharray:0 264}}.ring{animation:ring 1.2s ease-out}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
.hero{background:linear-gradient(135deg,var(--h1),var(--h2));color:var(--htx);padding:72px 16px}
.hero h1{font-size:clamp(32px,6vw,56px);line-height:1.1;font-weight:500}
.ov{position:fixed;inset:0;background:#000a;display:flex;align-items:center;justify-content:center;padding:16px;z-index:9}
.ov .card{max-width:440px;width:100%}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:var(--navy);color:#fff;padding:10px 16px;border-radius:12px;z-index:10;display:none;border:1px solid var(--teal)}
table{width:100%;border-collapse:collapse}td,th{padding:6px;border-bottom:1px solid var(--line);text-align:left;font-size:14px}
.chat{background:var(--bg);border-radius:12px;padding:10px;border:1px dashed var(--teal);font-size:14px}
html{scroll-behavior:smooth}body,.card,.nav,input,select,textarea{transition:background-color .35s ease,color .35s ease,border-color .35s ease}
.fi{opacity:0;transform:translateY(16px);transition:opacity .65s ease,transform .65s ease}.fi.in{opacity:1;transform:none}
.fab{position:fixed;right:14px;width:42px;height:42px;border-radius:50%;padding:0;z-index:6;font-size:18px;box-shadow:0 4px 14px #748DAE55}#tg{bottom:calc(64px + env(safe-area-inset-bottom,0px))}#tp{bottom:calc(112px + env(safe-area-inset-bottom,0px));display:none}
footer{text-align:center;padding:18px 16px 24px;color:var(--mut);font-size:12.5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}footer a{color:inherit;margin:0 4px;text-decoration:none;transition:color .2s}footer a:hover{color:var(--blue);text-decoration:underline}
</style></head><body><div id="app"></div><div id="toast" role="status"></div><button id="tp" class="fab" aria-label="Back to top">↑</button><button id="tg" class="fab" aria-label="Toggle dark mode">🌙</button><footer>© 2026 HOSTEL360 · <a href="#">Instagram</a> · <a href="#">LinkedIn</a> · <a href="#">X</a></footer>
<script>
const K='h360v1',H=36e5,now=()=>Date.now();let S,U=null,tab='',cart=[],modal='',sosT='Medical emergency',fac='Basketball court',fday=0;
const USERS={'student@hostel360.demo':{id:'u1',role:'student',name:'Aarav Sharma',sid:'22CS104',b:'A',room:'214'},'staff@hostel360.demo':{id:'st1',role:'staff',name:'Ramesh Kumar'},'warden@hostel360.demo':{id:'w1',role:'warden',name:'Dr. Meera Iyer'},'admin@hostel360.demo':{id:'ad1',role:'admin',name:'Admin Office'}};
const STAFF={st1:'Ramesh Kumar',st2:'Sunita Devi'},BL=['A','B','C'],CATS=['Cleaning','Water quality','Electricity','Plumbing','Mess and food','Sports facilities','Internet','Room maintenance','Laundry','Security','Furniture','Housekeeping','Staff behaviour','Peer complaint','General'];
const WT={clean:[.2,'Cleaning & hygiene'],water:[.15,'Water monitoring'],res:[.25,'Complaint resolution'],food:[.2,'Food satisfaction'],infra:[.15,'Infrastructure'],fb:[.05,'Student feedback']};
function seed(){const t=now(),tds=[];[[150,160,155,170,165,158,162],[250,270,310,290,320,305,300],[380,420,450,0,480,0,520]].forEach((a,i)=>a.forEach((v,d)=>{if(v)tds.push({b:BL[i],v,t:t-(6-d)*24*H,by:'Ramesh Kumar',note:''})}));
return{cs:[{id:'C-1001',cat:'Cleaning',d:'Second-floor bathroom not cleaned for 3 days',b:'A',room:'214',st:'In Progress',pr:'High',as:'st1',t:t-50*H,rem:'',fb:0,esc:0},
{id:'C-1002',cat:'Electricity',d:'Corridor light broken near stairs',b:'B',room:'105',st:'Assigned',pr:'Medium',as:'st1',t:t-5*H,rem:'',fb:0,esc:0},
{id:'C-1003',cat:'Water quality',d:'Tap water has a metallic smell',b:'C',room:'310',st:'Submitted',pr:'High',as:'',t:t-2*H,rem:'',fb:0,esc:0},
{id:'C-1004',cat:'Plumbing',d:'Leaking tap in washroom',b:'A',room:'214',st:'Resolved',pr:'Medium',as:'st2',t:t-30*H,rem:'Washer replaced',fb:4,esc:0}],
tds,sos:[],orders:[],bk:[],cr:{st1:100,st2:112},n:[{to:'student',m:'Welcome to HOSTEL360! Water test camp on Saturday.',t:t-H,r:0}],
ann:[{m:'Fire-safety inspection of Block B on Friday 10 AM.',t:t-6*H},{m:'Mess special: Paneer thali this Sunday.',t:t-20*H}],
food:{A:[5,4,4,5],B:[4,4,3,4],C:[3,3,4,2]},rated:[],base:{A:{clean:84,infra:80,fb:85},B:{clean:76,infra:72,fb:78},C:{clean:62,infra:66,fb:60}},
cfg:{warn:300,crit:500,pen:5,rew:3},aud:[],aw:[],ev:[]}}
const load=()=>{try{S=JSON.parse(localStorage.getItem(K))}catch(e){}S=S||seed();if(!S.lf)S.lf=[{id:'L-1',k:'Found',item:'Blue steel water bottle',loc:'Block B corridor',d:'Found near the stairs',by:'Ramesh Kumar (staff)',t:Date.now()-20*36e5,st:'Open'},{id:'L-2',k:'Lost',item:'Black earphone case',loc:'Hostel gym',d:'Lost on Monday evening',by:'Aarav Sharma',t:Date.now()-40*36e5,st:'Open'}]},save=()=>{try{localStorage.setItem(K,JSON.stringify(S))}catch(e){}};
const $=(h)=>{document.getElementById('app').innerHTML=h;reveal()},fm=t=>new Date(t).toLocaleString([], {dateStyle:'short',timeStyle:'short'});
const toast=m=>{const e=document.getElementById('toast');e.textContent=m;e.style.display='block';setTimeout(()=>e.style.display='none',2800)};
const ntf=(to,m)=>{S.n.unshift({to,m,t:now(),r:0})},aud=m=>S.aud.unshift({m,t:now(),by:U?U.name:'System'});
function esc(){let ch=0;S.cs.forEach(c=>{if(c.st!='Resolved'&&!c.esc&&(now()-c.t>48*H||c.pr=='Critical')){c.esc=1;ch=1;if(c.as)S.cr[c.as]-=S.cfg.pen;ntf('warden',`ESCALATED ${c.id} (${c.cat}, Block ${c.b})`);if(c.as)ntf('staff',`${c.id} escalated: -${S.cfg.pen} credits`);aud(`Auto-escalation ${c.id}; -${S.cfg.pen} credits to ${STAFF[c.as]||'unassigned'}`)}});if(ch)save()}
function score(b){const t=now(),d=new Set(S.tds.filter(x=>x.b==b&&t-x.t<7*24*H).map(x=>new Date(x.t).toDateString())).size,cs=S.cs.filter(c=>c.b==b),rs=cs.filter(c=>c.st=='Resolved'),f=S.food[b],fb=rs.filter(c=>c.fb),
o={clean:S.base[b].clean,water:Math.round(d/7*100),res:cs.length?Math.round(100*(rs.length+.5*cs.filter(c=>c.st!='Resolved'&&!c.esc).length)/cs.length):80,food:Math.round(f.reduce((a,x)=>a+x,0)/f.length*20),infra:S.base[b].infra,fb:fb.length?Math.round(fb.reduce((a,c)=>a+c.fb,0)/fb.length*20):S.base[b].fb};
o.tot=Math.round(Object.keys(WT).reduce((a,k)=>a+o[k]*WT[k][0],0));return o}
function ai(x){x=x.toLowerCase();const has=a=>a.some(w=>x.includes(w));let cat='General',dep='Hostel Office',act='Review and assign',pr='Medium',crit=0;
if(has(['ragging','threat','fire','smoke','gas','unconscious','bleeding','harass'])){cat='Security';dep='Warden + Anti-Ragging Cell';act='Use SOS now';pr='Critical';crit=1}
else if(has(['chair','table','bed ','mattress','cupboard','almirah','desk','furniture','wardrobe']))[cat,dep,act]=['Furniture','Carpentry / Maintenance','Inspect and repair or replace furniture'];else if(has(['rude','misbehav','staff behav','shouted at','abusive staff','guard was']))[cat,dep,act,pr]=['Staff behaviour','Warden (confidential)','Warden to review and speak with staff','High'];else if(has(['roommate','neighbour','neighbor','fellow student','another student','noisy student']))[cat,dep,act]=['Peer complaint','Warden / Counsellor (confidential)','Warden to mediate privately'];else if(has(['housekeeping','room sweep','dusting']))[cat,dep,act]=['Housekeeping','Housekeeping','Send housekeeping to the room'];else if(has(['water','tds','taste','smell','contamin']))[cat,dep,act,pr]=['Water quality','Maintenance','Re-test water and inspect tank','High'];
else if(has(['dirty','clean','bathroom','toilet','garbage','washroom']))[cat,dep,act]=['Cleaning','Housekeeping','Immediate inspection and cleaning'];
else if(has(['fan','light','switch','power','electric']))[cat,dep,act]=['Electricity','Electrical team','Inspect and repair'];
else if(has(['leak','tap','flush','pipe','drain']))[cat,dep,act]=['Plumbing','Plumbing team','Inspect and fix leak'];
else if(has(['food','mess','meal','stale']))[cat,dep,act]=['Mess and food','Mess management','Inspect kitchen and menu'];
else if(has(['wifi','internet','network']))[cat,dep,act]=['Internet','IT cell','Check router and uplink'];
else if(has(['laundry','clothes']))[cat,dep,act]=['Laundry','Laundry staff','Locate clothes'];
if(!crit&&has(['days','nobody','again','still','week']))pr='High';
const dup=S.cs.filter(c=>c.st!='Resolved'&&c.cat==cat&&c.b==(U&&U.b));return{cat,dep,act,pr,crit,dup,sum:x.trim().slice(0,90)}}
const tag=(s)=>`<span class="tag ${/Critical|ESC|Red/.test(s)?'t-r':/High|Yellow/.test(s)?'t-y':/Resolved|Green|Collected|Ready/.test(s)?'t-g':'t-b'}">${s}</span>`;
function ring(s,sz=130){return`<svg width="${sz}" height="${sz}" viewBox="0 0 100 100" role="img" aria-label="Score ${s} of 100"><circle cx="50" cy="50" r="42" fill="none" stroke="var(--line)" stroke-width="9"/><circle class="ring" cx="50" cy="50" r="42" fill="none" stroke="${s>=80?'#5FA37A':s>=65?'#7FB5C4':'#D6A25A'}" stroke-width="9" stroke-linecap="round" stroke-dasharray="${s*2.64} 264" transform="rotate(-90 50 50)"/><text x="50" y="57" text-anchor="middle" font-size="26" font-weight="800" fill="currentColor">${s}</text></svg>`}
function bars(o){return Object.keys(WT).map(k=>`<div class="mut">${WT[k][1]} (${WT[k][0]*100}%) – ${o[k]}</div><div class="bar" style="margin-bottom:6px"><i style="width:${o[k]}%"></i></div>`).join('')}
function tdsSt(v){return v>S.cfg.crit?'Red':v>S.cfg.warn?'Yellow':'Green'}
function chart(b){const a=S.tds.filter(x=>x.b==b).sort((x,y)=>x.t-y.t),X=i=>10+i*(280/Math.max(1,a.length-1)),Y=v=>95-v/600*90;return`<svg viewBox="0 0 300 100" width="100%" role="img" aria-label="TDS history block ${b}"><line x1="0" x2="300" y1="${Y(S.cfg.warn)}" y2="${Y(S.cfg.warn)}" stroke="#D97706" stroke-dasharray="3"/><line x1="0" x2="300" y1="${Y(S.cfg.crit)}" y2="${Y(S.cfg.crit)}" stroke="#DC2626" stroke-dasharray="3"/><polyline fill="none" stroke="#6F89AD" stroke-width="2" points="${a.map((x,i)=>X(i)+','+Y(x.v)).join(' ')}"/>${a.map((x,i)=>`<circle cx="${X(i)}" cy="${Y(x.v)}" r="3" fill="#8FB8C4"><title>${x.v} ppm ${fm(x.t)}</title></circle>`).join('')}</svg>`}
function waterBlock(b){const l=S.tds.filter(x=>x.b==b).sort((x,y)=>y.t-x.t)[0],today=l&&new Date(l.t).toDateString()==new Date().toDateString();return`<div class="card"><div class="row"><h3>Block ${b}</h3>${l?tag(tdsSt(l.v)):''}</div>${l?`<b style="font-size:26px">${l.v} ppm</b> <span class="mut">${fm(l.t)} by ${l.by}</span>`:'No readings'}${today?'':'<p><span class="tag t-r">Reading missing today</span></p>'}${chart(b)}</div>`}
const WNOTE='<p class="mut">TDS monitoring indicator only. It is not a drinking-water safety certification; full lab testing is still required.</p>';
function login(e,p){const u=USERS[(e||'').trim().toLowerCase()];if(!u||p!=='demo123'){toast('Wrong email or password. Use a demo account below.');return}U=u;tab={student:'home',staff:'tasks',warden:'ov',admin:'ov'}[u.role];render()}
function out(){U=null;render()}
function render(){esc();save();if(!U){$(`<div class="hero"><div class="wrap"><div class="logo" style="font-size:26px">HOSTEL<b>360</b></div><h1>The smarter way to live.</h1><p style="max-width:560px;font-size:18px">One place for complaints with a 48-hour clock, one-tap emergency help, daily water monitoring and a live health score for every hostel block.</p></div></div><div class="wrap"><div class="grid"><div class="card"><h2>Judge demo login</h2><p class="mut">Tap a role to explore. Password for all: demo123</p>${[['student','Student – Aarav (Block A)'],['staff','Hostel staff – Ramesh'],['warden','Warden – Dr. Iyer'],['admin','Administrator']].map(r=>`<button class="${r[0]=='student'?'p':'act'}" style="width:100%;margin:4px 0" onclick="login('${r[0]}@hostel360.demo','demo123')">Enter as ${r[1]}</button>`).join('')}<hr><input id="em" placeholder="email e.g. warden@hostel360.demo" aria-label="Email"><input id="pw" type="password" placeholder="demo123" aria-label="Password"><button class="p" onclick="login(em.value,pw.value)">Sign in</button></div>
<div class="card"><h2>The problem</h2><p>Hostel complaints vanish, water quality is invisible and emergencies get lost in phone calls.</p><h2>Five signature features</h2><p>1. Live Hostel Health Score<br>2. One-tap SOS with audit trail<br>3. Water Intelligence (daily TDS)<br>4. AI complaint assistant (rule-based demo)<br>5. Fair performance leaderboard</p></div>
<div class="card"><h2>Honest status</h2><p class="mut">Demo build. Data and sign-in live in your browser (localStorage); no server, no real SMS or sensors. Escalation runs when the app loads or ticks. See what's left out after sign-in as warden.</p></div></div></div>`);return}
const T={student:[['home','Home'],['cmp','Complaints'],['wat','Water'],['menu','Mess menu'],['mess','Order food'],['bk','Book'],['lf','Lost & found'],['al','Alerts']],staff:[['tasks','My tasks'],['wat','Water entry'],['ord','Orders'],['lf','Lost & found']],warden:[['ov','Overview'],['cmp','Complaints'],['sos','Emergencies'],['wat','Water'],['lb','Leaderboard'],['lf','Lost & found'],['an','Announce']]};T.admin=[...T.warden,['cfg','Config & audit']];
const un=S.n.filter(n=>!n.r&&n.to==U.role).length;
$(`<div class="top"><span class="logo">HOSTEL<b>360</b></span><span style="flex:1"></span><span>${U.name} ${tag(U.role)}</span><button onclick="out()">Sign out</button></div><div class="nav">${T[U.role].map(t=>`<button class="${tab==t[0]?'act':''}" onclick="tab='${t[0]}';render()">${t[1]}${t[0]=='al'&&un?` (${un})`:''}</button>`).join('')}${U.role!='student'?`<button onclick="tab='nt';render()">Notifications${un?` (${un})`:''}</button>`:''}</div><div class="wrap">${view()}</div>${modal=='sos'?sosModal():''}`)}
function cRow(c,w){const od=c.st!='Resolved'&&now()-c.t>48*H;return`<div class="card"><div class="row"><b>${c.id} · ${c.cat}</b><span>${tag(c.st)} ${tag(c.pr)} ${c.esc?tag('ESCALATED'):''}</span></div><p>${c.d}</p><div class="mut">Block ${c.b}, room ${c.room} · ${fm(c.t)} · due ${fm(c.t+48*H)} · ${STAFF[c.as]||'Unassigned'}${od?' · OVERDUE':''}${c.rem?' · Remarks: '+c.rem:''}</div>${acts(c,w)}</div>`}
function acts(c,w){const F=['Submitted','Acknowledged','Assigned','In Progress','Resolved'],i=F.indexOf(c.st);let h='';
if(U.role=='student'){if(c.st=='Resolved'){h+=c.fb?`<span class="mut">Your rating: ${c.fb}/5 </span>`:[1,2,3,4,5].map(n=>`<button onclick="rate('${c.id}',${n})">${n}★</button>`).join(' ');h+=` <button onclick="reopen('${c.id}')">Reopen</button>`}}
else{if(U.role!='staff')h+=`<select style="width:auto" onchange="assign('${c.id}',this.value)"><option value="">Assign…</option>${Object.keys(STAFF).map(s=>`<option value="${s}" ${c.as==s?'selected':''}>${STAFF[s]}</option>`)}</select> `;if(i<4&&i>=0)h+=`<button class="p" onclick="adv('${c.id}')">Mark ${F[i+1]}</button>`}return h}
const adv=id=>{const F=['Submitted','Acknowledged','Assigned','In Progress','Resolved'],c=S.cs.find(x=>x.id==id);c.st=F[F.indexOf(c.st)+1];if(c.st=='Resolved'){c.rem=c.rem||'Fixed by '+(U.name);if(c.as&&now()-c.t<=48*H){S.cr[c.as]+=S.cfg.rew;aud(`+${S.cfg.rew} credits ${STAFF[c.as]} for timely ${c.id}`)}}ntf('student',`${id} is now ${c.st}`);toast('Status: '+c.st);render()};
const assign=(id,s)=>{const c=S.cs.find(x=>x.id==id);c.as=s;if(s&&c.st=='Submitted'||c.st=='Acknowledged')c.st='Assigned';ntf('staff',`${id} assigned to ${STAFF[s]}`);aud(`Assigned ${id} to ${STAFF[s]}`);render()};
const reopen=id=>{const c=S.cs.find(x=>x.id==id);c.st='Submitted';c.t=now();c.esc=0;ntf('warden',`${id} REOPENED by student`);render()};
const rate=(id,n)=>{S.cs.find(x=>x.id==id).fb=n;toast('Thanks for the feedback');render()};
function submitC(){const d=document.getElementById('cd').value,a=ai(d),sel=document.getElementById('cc').value;if(sel)a.cat=sel;if(d.trim().length<8){toast('Describe the issue in a few words first');return}const c={id:'C-'+(1001+S.cs.length),cat:a.cat,d,b:U.b,room:U.room,st:'Submitted',pr:a.pr,as:'',t:now(),rem:'',fb:0,esc:0};S.cs.unshift(c);ntf('warden',`New ${a.pr} complaint ${c.id}: ${a.cat}`);if(a.crit)ntf('warden','CRITICAL report '+c.id+' – immediate attention');toast('Complaint '+c.id+' filed');render()}
function chat(){const d=document.getElementById('cd').value,o=document.getElementById('ai');if(!d.trim()){o.innerHTML='Describe your problem and I will suggest a category, priority and department.';return}const a=ai(d);o.innerHTML=`<b>Demo assistant (rule-based)</b><br>Category: ${a.cat} · Priority: ${a.pr} · Dept: ${a.dep}<br>Next action: ${a.act}<br>Summary: ${a.sum}${a.crit?'<br><b style="color:var(--red)">Urgent safety issue – press SOS instead of waiting.</b>':''}${a.dup.length?`<br>Possible duplicates: ${a.dup.map(c=>c.id).join(', ')}`:''}`}
function sosModal(){const ty=['Medical emergency','Ragging or personal safety','Fire','Security threat','Other emergency'];return`<div class="ov"><div class="card" role="dialog" aria-modal="true"><h2 style="color:var(--red)">Confirm emergency</h2><p>Sends a high-priority alert for <b>Block ${U.b}, room ${U.room}</b> to the warden and staff. For life-threatening cases also call local emergency services (112).</p>${ty.map(t=>`<label style="display:block;padding:6px"><input type="radio" name="st" style="width:auto;margin:0 8px 0 0" ${sosT==t?'checked':''} onchange="sosT='${t}'">${t}</label>`).join('')}<div class="row"><button onclick="modal='';render()">Go back</button><button class="r" onclick="doSos()">Send SOS now</button></div></div></div>`}
function doSos(){S.sos.unshift({id:'S-'+(500+S.sos.length),ty:sosT,b:U.b,room:U.room,t:now(),st:'Alerted',by:U.name,rs:''});ntf('warden',`SOS: ${sosT} – Block ${U.b} ${U.room}`);ntf('staff',`SOS: ${sosT} – Block ${U.b} ${U.room}`);aud('SOS raised '+sosT);modal='';toast('SOS sent. Help is being alerted.');render()}
function view(){const r=U.role,b=U.b;if(tab=='lf')return lfV();
if(tab=='nt'||tab=='al'){S.n.filter(n=>n.to==r).forEach(n=>n.r=1);return`<h2>Notifications</h2>${S.n.filter(n=>n.to==r).map(n=>`<div class="card" style="margin:6px 0">${n.m}<div class="mut">${fm(n.t)}</div></div>`).join('')||'<p class="mut">Nothing yet.</p>'}`}
if(r=='student'){
if(tab=='home'){const s=score(b),my=S.sos.filter(x=>x.by==U.name);return`<div class="grid"><div class="card"><h3>Hello, ${U.name}</h3><div class="mut">${U.sid} · Block ${b} · Room ${U.room}</div><p></p><button class="sos" onclick="modal='sos';render()">🚨 EMERGENCY SOS</button>${my.map(x=>`<p>${x.id} ${x.ty}: ${tag(x.st)} ${x.st=='Alerted'||x.st=='Acknowledged'?`<button onclick="cancelSos('${x.id}')">Cancel false alarm</button>`:''}</p>`).join('')}</div>
<div class="card"><h3>Block ${b} Health Score</h3><div class="row">${ring(s.tot)}<div style="flex:1;min-width:170px">${bars(s)}</div></div><p class="mut">Weighted: resolution quality counts more than fewer complaints, so reporting is never punished.</p></div>
<div class="card"><h3>Water status</h3>${waterBlock(b)}${WNOTE}</div>
<div class="card"><h3>Noticeboard</h3>${S.ann.map(a=>`<p>📌 ${a.m}<br><span class="mut">${fm(a.t)}</span></p>`).join('')}</div></div>`}
if(tab=='cmp')return`<div class="grid"><div class="card"><h3>New complaint</h3><label class="mut">Category</label><select id="cc" onchange="chat()"><option value="">Auto-detect (assistant)</option>${CATS.map(c=>`<option>${c}</option>`).join('')}</select><p class="mut">Staff behaviour and peer complaints go only to the warden and are never shown to staff.</p><textarea id="cd" rows="4" oninput="chat()" placeholder="e.g. The bathroom on the second floor has been dirty for three days and nobody has cleaned it."></textarea><div class="chat" id="ai">Describe your problem and I will suggest a category, priority and department.</div><p><button class="p" onclick="submitC()">Submit complaint</button></p></div><div>${S.cs.filter(c=>c.b==b&&c.room==U.room).map(c=>cRow(c)).join('')}</div></div>`;
if(tab=='wat')return`<h2>Water Intelligence</h2>${WNOTE}<div class="grid">${BL.map(waterBlock).join('')}</div><div class="card" style="margin-top:12px"><h3>Report water concern</h3><p class="mut">Use New complaint → Complaints tab (category auto-detected for taste/smell/colour).</p></div>`;
if(tab=='menu')return menuV();if(tab=='mess')return messV();
if(tab=='bk')return bkV()}
if(r=='staff'){
if(tab=='tasks')return`<h2>My tasks</h2><p class="mut">Credits: <b>${S.cr[U.id]}</b></p><div class="grid">${S.cs.filter(c=>c.as==U.id).map(c=>cRow(c)).join('')||'<p>No tasks assigned.</p>'}</div>`;
if(tab=='wat')return`<div class="card"><h3>Enter daily TDS reading</h3><select id="tb">${BL.map(x=>`<option>${x}</option>`)}</select><input id="tv" type="number" placeholder="TDS in ppm"><input id="tn" placeholder="Corrective action / note"><button class="p" onclick="addT()">Save reading</button>${WNOTE}</div><div class="grid" style="margin-top:12px">${BL.map(waterBlock).join('')}</div>`;
if(tab=='ord')return ordV()}
if(r=='warden'||r=='admin'){
if(tab=='ov'){const od=S.cs.filter(c=>c.esc&&c.st!='Resolved');return`<div class="grid">${BL.map(x=>{const s=score(x);return`<div class="card"><h3>Block ${x}</h3>${ring(s.tot,110)}${bars(s)}</div>`}).join('')}</div><div class="grid" style="margin-top:12px"><div class="card"><h3>Open emergencies: ${S.sos.filter(x=>!/Resolved|Cancel/.test(x.st)).length}</h3><h3>Escalated complaints: ${od.length}</h3><h3>Complaints resolved: ${S.cs.filter(c=>c.st=='Resolved').length}/${S.cs.length}</h3></div><div class="card"><h3>Complaints by category</h3>${CATS.map(k=>[k,S.cs.filter(c=>c.cat==k).length]).filter(x=>x[1]).map(x=>`<div class="mut">${x[0]} – ${x[1]}</div><div class="bar" style="margin-bottom:5px"><i style="width:${x[1]/S.cs.length*100}%"></i></div>`).join('')}</div></div>`}
if(tab=='cmp')return`<div class="row"><h2>All complaints</h2><button onclick="ff()">Simulate +49 hours (demo)</button></div><div class="grid">${S.cs.map(c=>cRow(c)).join('')}</div>`;
if(tab=='sos')return`<h2>Emergency alerts</h2>${S.sos.map(x=>`<div class="card" style="margin:8px 0"><div class="row"><b>${x.id} · ${x.ty}</b>${tag(x.st)}</div><div class="mut">Block ${x.b}, room ${x.room} · ${fm(x.t)} · ${x.by} · Responder: ${x.rs||'none'}</div>${/Resolved|Cancel/.test(x.st)?'':`<button class="p" onclick="sosAct('${x.id}','Acknowledged')">Acknowledge</button> <button class="g" onclick="sosAct('${x.id}','Resolved')">Resolve</button>`}</div>`).join('')||'<p class="mut">No emergencies. Ask the student demo account to press SOS.</p>'}`;
if(tab=='wat')return`<h2>Water Intelligence</h2>${WNOTE}<div class="grid">${BL.map(waterBlock).join('')}</div>`;
if(tab=='lb'){const rk=BL.map(x=>[x,score(x).tot]).sort((a,b)=>b[1]-a[1]);return`<h2>Leaderboards</h2><p class="mut">Celebrates improvement. Credits come from verified resolutions, not complaint counts.</p><div class="grid"><div class="card"><h3>Hostel blocks</h3>${rk.map((x,i)=>`<div class="row"><span>${['🥇','🥈','🥉'][i]} Block ${x[0]}</span><b>${x[1]}</b>${r=='warden'?`<button onclick="award('Block ${x[0]}')">Approve award</button>`:''}</div>`).join('')}</div><div class="card"><h3>Staff credits</h3>${Object.keys(STAFF).sort((a,b)=>S.cr[b]-S.cr[a]).map(k=>`<div class="row"><span>${STAFF[k]}</span><b>${S.cr[k]}</b></div>`).join('')}</div><div class="card"><h3>Recognition</h3>${S.aw.map(a=>`<p>🏅 ${a}</p>`).join('')||'<p class="mut">No awards approved yet.</p>'}</div></div>`}
if(tab=='an')return`<div class="card"><h3>Publish announcement</h3><textarea id="am" rows="3"></textarea><button class="p" onclick="pub()">Publish</button></div>`;
if(tab=='cfg')return`<div class="grid"><div class="card"><h3>Thresholds & rules</h3>${[['warn','TDS warning (ppm)'],['crit','TDS critical (ppm)'],['pen','Overdue penalty credits'],['rew','On-time reward credits']].map(k=>`<label class="mut">${k[1]}</label><input type="number" value="${S.cfg[k[0]]}" onchange="S.cfg.${k[0]}=+this.value;save();toast('Saved')">`).join('')}<button onclick="localStorage.removeItem(K);load();out()">Reset demo data</button></div><div class="card"><h3>Audit log</h3>${S.aud.slice(0,15).map(a=>`<p class="mut">${fm(a.t)} · ${a.by}: ${a.m}</p>`).join('')||'<p class="mut">No entries.</p>'}</div></div>`}
return''}
const cancelSos=id=>{const x=S.sos.find(s=>s.id==id);x.st='Cancelled (false alarm)';aud('SOS cancelled '+id);ntf('warden','SOS '+id+' cancelled by student');render()};
const sosAct=(id,s)=>{const x=S.sos.find(q=>q.id==id);x.st=s;x.rs=U.name;aud(`SOS ${id} ${s}`);toast('Updated');render()};
const ff=()=>{S.cs.forEach(c=>{if(c.st!='Resolved')c.t-=49*H});esc();toast('Time advanced: overdue complaints escalated and credits deducted');render()};
const award=n=>{S.aw.unshift(n+' – Best performance this month');toast('Award approved');render()};
const pub=()=>{const m=document.getElementById('am').value;if(!m.trim())return;S.ann.unshift({m,t:now()});ntf('student','📢 '+m);toast('Published');render()};
function addT(){const v=+document.getElementById('tv').value;if(!v||v<0){toast('Enter a valid ppm number');return}S.tds.push({b:document.getElementById('tb').value,v,t:now(),by:U.name,note:document.getElementById('tn').value});if(v>S.cfg.warn)ntf('warden','TDS '+tdsSt(v)+' reading: '+v+' ppm');toast('Reading saved');render()}
const MENU=[['Poha',30,'Breakfast'],['Veg thali',80,'Lunch'],['Samosa',15,'Snacks'],['Paneer curry + roti',90,'Dinner'],['Masala dosa',50,'Snacks']];
function messV(){const mine=S.orders.filter(o=>o.by==U.id);return`<div class="grid"><div class="card"><h3>Order food (allergen info at counter)</h3>${MENU.map((m,i)=>`<div class="row"><span>${m[0]} <span class="mut">₹${m[1]} · ${m[2]}</span></span><button onclick="cart.push(${i});render()">Add</button></div>`).join('')}<hr><b>Cart: ${cart.map(i=>MENU[i][0]).join(', ')||'empty'}</b><select id="sl"><option>12:30–12:45</option><option>13:00–13:15</option><option>19:30–19:45</option></select><button class="p" onclick="place()">Place order</button></div><div class="card"><h3>My orders</h3>${mine.map(o=>`<p>${o.id}: ${o.it.join(', ')} · ${o.sl} ${tag(o.st)} ${o.st=='Collected'&&!S.rated.includes(o.id)?[3,4,5].map(n=>`<button onclick="rateF('${o.id}',${n})">${n}★</button>`).join(' '):''}</p>`).join('')||'<p class="mut">No orders yet.</p>'}</div></div>`}
function place(){if(!cart.length){toast('Add an item first');return}S.orders.unshift({id:'O-'+(700+S.orders.length),by:U.id,b:U.b,it:cart.map(i=>MENU[i][0]),sl:document.getElementById('sl').value,st:'Placed'});ntf('staff','New food order from Block '+U.b);cart=[];toast('Order placed');render()}
function rateF(id,n){if(S.rated.includes(id))return;S.rated.push(id);S.food[U.b].push(n);toast('Verified rating counted (one per order)');render()}
const OS=['Placed','Accepted','Preparing','Ready for Collection','Collected'];
function ordV(){return`<h2>Food orders</h2>${S.orders.map(o=>`<div class="card" style="margin:6px 0"><div class="row"><b>${o.id} · Block ${o.b}</b>${tag(o.st)}</div>${o.it.join(', ')} · ${o.sl} ${o.st!='Collected'?`<button class="p" onclick="oadv('${o.id}')">Mark ${OS[OS.indexOf(o.st)+1]}</button>`:''}</div>`).join('')||'<p class="mut">No orders yet. Place one as the student.</p>'}`}
function oadv(id){const o=S.orders.find(x=>x.id==id);o.st=OS[OS.indexOf(o.st)+1];ntf('student',`Order ${id}: ${o.st}`);render()}
function bkV(){const F=['Basketball court','Tennis court','Hostel gym','Swimming pool','Gaming room','Common hall TV'],d=new Date(now()+fday*864e5).toDateString(),sl=['06:00','08:00','16:00','18:00','20:00'];return`<div class="card"><h3>Book a facility</h3><select onchange="fac=this.value;render()">${F.map(f=>`<option ${f==fac?'selected':''}>${f}</option>`)}</select><select onchange="fday=+this.value;render()"><option value="0" ${fday?'':'selected'}>Today</option><option value="1" ${fday?'selected':''}>Tomorrow</option></select><div>${sl.map(s=>{const k=S.bk.find(x=>x.f==fac&&x.d==d&&x.s==s);return`<button ${k?'disabled':''} class="${k?'':'p'}" onclick="book('${s}')">${s}${k?' (booked)':''}</button> `}).join('')}</div></div><div class="card" style="margin-top:12px"><h3>My bookings</h3>${S.bk.filter(x=>x.by==U.id).map((x,i)=>`<p>${x.f} · ${x.d} ${x.s} <button onclick="unbook('${x.f}','${x.d}','${x.s}')">Cancel</button></p>`).join('')||'<p class="mut">None.</p>'}</div>`}
function book(s){const d=new Date(now()+fday*864e5).toDateString();if(S.bk.some(x=>x.f==fac&&x.d==d&&x.s==s)){toast('Slot already taken');return}S.bk.push({f:fac,d,s,by:U.id});ntf('student','Booked '+fac+' '+s);toast('Booking confirmed');render()}
const unbook=(f,d,s)=>{S.bk=S.bk.filter(x=>!(x.f==f&&x.d==d&&x.s==s));toast('Cancelled');render()};
const MT=['Breakfast · 7:30–9:00','Lunch · 12:30–2:00','Snacks · 5:00–6:00','Dinner · 7:30–9:00'];
const MM=[['Sunday',['Chole bhature, tea','Rice, rajma, mixed veg, curd, salad','Veg sandwich, chutney, tea','Chicken or paneer curry, roti, rice, gulab jamun']],['Monday',['Poha, banana, tea','Rice, dal tadka, aloo gobi, roti, salad','Samosa, green chutney, tea','Roti, paneer butter masala, jeera rice, kheer']],['Tuesday',['Aloo paratha, curd, tea','Rice, sambar, bhindi fry, roti, papad','Bread pakora, tea','Roti, dal makhani, veg pulao, fruit custard']],['Wednesday',['Idli, sambar, coconut chutney, tea','Rice, kadhi, cabbage sabzi, roti, salad','Poha cutlet, ketchup, tea','Roti, egg curry or soya chaap, rice, halwa']],['Thursday',['Upma, boiled egg or banana, tea','Rice, dal fry, paneer bhurji, roti, curd','Masala corn, tea','Roti, mix veg, veg biryani, raita, ice cream']],['Friday',['Puri bhaji, tea','Rice, chana dal, lauki sabzi, roti, salad','Pasta, tea','Roti, kadai paneer, rice, jalebi']],['Saturday',['Masala dosa, sambar, tea','Veg thali: dal, 2 sabzi, rice, roti, sweet','Kachori, tamarind chutney, tea','Roti, dal tadka, aloo matar, fried rice, seviyan']]];
function menuV(){const d=new Date().getDay();return`<h2>Mess menu · today is ${MM[d][0]}</h2><div class="grid">${MM[d][1].map((x,i)=>`<div class="card"><h3>${MT[i]}</h3>${x}</div>`).join('')}</div><div class="card" style="margin-top:12px"><h3>Weekly menu</h3><div style="overflow-x:auto"><table><tr><th>Day</th><th>Breakfast</th><th>Lunch</th><th>Snacks</th><th>Dinner</th></tr>${MM.map((r,i)=>`<tr ${i==d?'style="font-weight:700"':''}><td>${r[0]}</td>${r[1].map(x=>`<td>${x}</td>`).join('')}</tr>`).join('')}</table></div></div><p class="mut">Sample menu for the demo. Meals may contain gluten, dairy, nuts or eggs; ask at the counter for allergen details. Use Order food for extra items.</p>`}
let lfq='';
function lfV(){const l=S.lf.filter(x=>(x.item+' '+x.loc+' '+x.d).toLowerCase().includes(lfq.toLowerCase()));return`<div class="grid"><div class="card"><h3>Post an item</h3><select id="lk"><option>Lost</option><option>Found</option></select><input id="li" placeholder="Item (e.g. black wallet)"><input id="ll" placeholder="Where it was lost or found"><textarea id="ld" rows="2" placeholder="Description (keep one identifying detail private for ownership check)"></textarea><button class="p" onclick="lfPost()">Post item</button></div><div class="card"><h3>Search</h3><input value="${lfq}" placeholder="Type, then press Enter" onchange="lfq=this.value;render()" aria-label="Search lost and found"><p class="mut">Contact is secure: claims go through the warden office, and valuables are handed over only after ownership is verified.</p></div></div><div class="grid" style="margin-top:12px">${l.map(x=>`<div class="card"><div class="row"><b>${x.item}</b><span><span class="tag ${x.k=='Found'?'t-g':'t-y'}">${x.k}</span> ${tag(x.st)}</span></div><p>${x.d||''}</p><div class="mut">${x.loc} · ${fm(x.t)} · Posted by ${x.by}${x.cl?' · Claim by '+x.cl:''}</div>${U.role=='student'&&x.st=='Open'&&x.by!=U.name?`<button class="p" onclick="lfClaim('${x.id}')">${x.k=='Found'?'This is mine':'I found this'}</button>`:''}${U.role!='student'&&x.st=='Claim pending'?`<button class="g" onclick="lfVerify('${x.id}')">Ownership verified, hand over</button>`:''}</div>`).join('')||'<p class="mut">No matching items. Post one above.</p>'}</div>`}
function lfPost(){const i=document.getElementById('li').value.trim();if(!i){toast('Enter the item name');return}S.lf.unshift({id:'L-'+(Date.now()%100000),k:document.getElementById('lk').value,item:i,loc:document.getElementById('ll').value||'Not given',d:document.getElementById('ld').value,by:U.name,t:Date.now(),st:'Open'});toast('Posted');render()}
function lfClaim(id){const x=S.lf.find(q=>q.id==id);x.st='Claim pending';x.cl=U.name;ntf('warden','Lost & found claim: '+x.item+' by '+U.name);ntf('staff','Lost & found claim: '+x.item);toast('Claim sent. Bring ID proof to the warden office.');render()}
function lfVerify(id){const x=S.lf.find(q=>q.id==id);x.st='Handed over';aud('Lost & found handed over: '+x.item+' to '+x.cl);ntf('student','Your item "'+x.item+'" has been handed over');toast('Marked handed over');render()}
let lastK='';
function reveal(){const k=(U?U.id:'login')+tab,first=k!=lastK;lastK=k;if(!first||!('IntersectionObserver' in window)||matchMedia('(prefers-reduced-motion:reduce)').matches)return;const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){const t=e.target;t.classList.add('in');io.unobserve(t);setTimeout(()=>{t.classList.remove('fi','in');t.style.transitionDelay=''},1000)}}),{threshold:.06});document.querySelectorAll('#app .card,#app .hero>.wrap,#app h2').forEach((e,i)=>{e.classList.add('fi');e.style.transitionDelay=Math.min(i,8)*60+'ms';io.observe(e)})}
function setTh(t,s){document.documentElement.setAttribute('data-theme',t);document.getElementById('tg').textContent=t=='dark'?'☀️':'🌙';if(s)try{localStorage.setItem('h360th',t)}catch(e){}}
let th='';try{th=localStorage.getItem('h360th')||''}catch(e){}
setTh(th||(matchMedia('(prefers-color-scheme:dark)').matches?'dark':'light'));
document.getElementById('tg').onclick=()=>setTh(document.documentElement.getAttribute('data-theme')=='dark'?'light':'dark',1);
const tpb=document.getElementById('tp');tpb.onclick=()=>scrollTo({top:0,behavior:'smooth'});addEventListener('scroll',()=>{tpb.style.display=scrollY>400?'block':'none'},{passive:true});
load();render();setInterval(()=>{if(U){esc()}},60000);
</script></body></html>
